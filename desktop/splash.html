<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       font-family:Segoe UI,Arial,sans-serif;background:#fff;color:#222;-webkit-app-region:drag;user-select:none}
  img{width:96px;height:96px;object-fit:contain;margin-bottom:12px}
  h1{font-size:26px;margin:0 0 22px}
  .spin{width:34px;height:34px;border:4px solid #ddd;border-top-color:#333;border-radius:50%;animation:s 0.9s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style></head>
<body>
  <img src="logo.png" onerror="this.style.display='none'">
  <h1>PaperBank</h1>
  <div class="spin"></div>
</body></html>
